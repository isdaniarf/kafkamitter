# A managed cluster that uses SASL over TLS.
# This is the shape that the Kafka CLI, Offset Explorer, and Aiven produce.
# Replace every value below with your own.
#
# Import it with: kafkamitter --import examples/sasl-ssl.properties

bootstrap.servers=broker-1.example.com:9094,broker-2.example.com:9094
security.protocol=SASL_SSL

# Supported mechanisms: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512.
sasl.mechanism=SCRAM-SHA-512
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="my-user" password="my-password";

# Instead of sasl.jaas.config you can give the two values directly:
# sasl.username=my-user
# sasl.password=my-password

# The certificate authority that signs the broker certificate.
# Give either a PEM file:
# ssl.ca.location=/path/to/ca.pem
# or a Java truststore, which Kafkamitter converts to PEM on import:
ssl.truststore.type=JKS
ssl.truststore.location=/path/to/client.truststore.jks
ssl.truststore.password=my-truststore-password

# Kafkamitter ignores a client keystore, because SASL does not need one.
# ssl.keystore.location=/path/to/client.keystore.p12

ssl.endpoint.identification.algorithm=https
